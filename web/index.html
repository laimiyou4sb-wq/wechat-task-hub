<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>微信待办</title>
  <meta name="description" content="把微信群里的通知自动整理成待办清单，随时查看、完成和稍后提醒。">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="微信待办">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./logo.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#taskList">跳到任务列表</a>

  <div class="app-shell">
    <div class="app-top">
      <header class="topbar" id="topbar">
        <div class="brand">
          <span class="orbit-mark" aria-hidden="true"><i></i><i></i><b></b></span>
          <h1 class="brand-title">微信待办</h1>
          <span class="brand-tag">DESK</span>
        </div>

        <div class="search" id="searchBox">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m16.5 16.5 4 4"></path>
          </svg>
          <label class="sr-only" for="searchInput">搜索任务</label>
          <input id="searchInput" type="search" placeholder="搜索任务、群名或备注" autocomplete="off" spellcheck="false">
          <kbd class="search-kbd" aria-hidden="true">/</kbd>
        </div>

        <div class="top-right">
          <div class="sync" id="syncStatus" role="status" aria-live="polite" title="同步状态">
            <span class="sync-dot" id="syncDot" data-state="syncing" aria-hidden="true"></span>
            <span class="sync-text" id="syncText">连接中</span>
          </div>
          <button class="icon-btn" id="refreshBtn" type="button" aria-label="刷新任务" title="刷新">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M20.5 12a8.5 8.5 0 1 1-2.49-6.01"></path>
              <path d="M20.5 4v5.5H15"></path>
            </svg>
          </button>
          <a class="icon-btn" id="settingsLink" href="./settings.html" aria-label="设置" title="设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.16.38.5.7.9.86H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.14z"></path>
            </svg>
          </a>
        </div>
      </header>

      <div class="tabs-wrap">
        <nav aria-label="任务分组">
          <div class="tabs" id="tabs" role="tablist" aria-label="视图切换">
            <button class="tab" id="tab-today" type="button" role="tab" aria-selected="true" aria-controls="taskList" data-tab="today">
              今天<span class="badge" data-count="today">0</span>
            </button>
            <button class="tab" id="tab-week" type="button" role="tab" aria-selected="false" aria-controls="taskList" data-tab="week" tabindex="-1">
              本周<span class="badge" data-count="week">0</span>
            </button>
            <button class="tab" id="tab-later" type="button" role="tab" aria-selected="false" aria-controls="taskList" data-tab="later" tabindex="-1">
              以后<span class="badge" data-count="later">0</span>
            </button>
            <button class="tab" id="tab-done" type="button" role="tab" aria-selected="false" aria-controls="taskList" data-tab="done" tabindex="-1">
              已完成<span class="badge" data-count="done">0</span>
            </button>
          </div>
        </nav>
      </div>
    </div>

    <div class="shell">
      <!-- 桌面端左导航（窄屏隐藏，改用顶部 tabs） -->
      <nav class="rail" id="rail" aria-label="任务分组">
        <div class="rail__label">待办</div>
        <button class="nav-item is-active" id="nav-today" type="button" aria-current="page" data-tab="today">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          <span>今天</span><b data-count="today">0</b>
        </button>
        <button class="nav-item" id="nav-week" type="button" data-tab="week">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
          <span>本周</span><b data-count="week">0</b>
        </button>
        <button class="nav-item" id="nav-later" type="button" data-tab="later">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
          <span>以后</span><b data-count="later">0</b>
        </button>

        <div class="rail__sep" aria-hidden="true"></div>
        <div class="rail__label">归档</div>
        <button class="nav-item" id="nav-done" type="button" data-tab="done">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m4 12 5 5L20 6"></path></svg>
          <span>已完成</span><b data-count="done">0</b>
        </button>
        <button class="nav-item" id="nav-ignored" type="button" data-tab="ignored">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"></circle><path d="m8 8 8 8M16 8l-8 8"></path></svg>
          <span>已忽略</span><b data-count="ignored">0</b>
        </button>
        <button class="nav-item" id="nav-snoozed" type="button" data-tab="snoozed">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
          <span>稍后</span><b data-count="snoozed">0</b>
        </button>

        <div class="rail__foot">
          <p><span>本周完成</span><b id="weekProgressText">0 / 0</b></p>
          <div class="rail__bar" aria-hidden="true"><i id="weekProgressBar" style="width:0%"></i></div>
        </div>
      </nav>

      <main class="main" id="main">
        <div class="banner-slot" id="bannerSlot"></div>
        <noscript>
          <div class="banner banner--error" role="alert">需要启用 JavaScript 才能使用微信待办。</div>
        </noscript>

        <div class="list-head" id="listHead">
          <h2 class="list-title" id="listTitle">今天</h2>
          <span class="list-sub" id="listSub">0 项</span>
          <span class="list-spacer"></span>
          <button class="chip-btn" id="selectBtn" type="button" aria-pressed="false" hidden>选择</button>
          <button class="chip-btn" id="newTaskBtn" type="button">新建任务</button>
        </div>

        <!-- 批次 4（需求 D）：手机端归档分段切换（<1024px 且处于已完成/已忽略/稍后视图时显示） -->
        <div class="mobile-archive" id="mobileArchiveBar" role="group" aria-label="归档视图切换" hidden>
          <div class="mobile-archive__inner">
            <button class="mobile-archive__btn" type="button" data-archive="done" aria-pressed="true">
              已完成<span class="mobile-archive__count" data-archive-count="done">0</span>
            </button>
            <button class="mobile-archive__btn" type="button" data-archive="ignored" aria-pressed="false">
              已忽略<span class="mobile-archive__count" data-archive-count="ignored">0</span>
            </button>
            <button class="mobile-archive__btn" type="button" data-archive="snoozed" aria-pressed="false">
              稍后<span class="mobile-archive__count" data-archive-count="snoozed">0</span>
            </button>
          </div>
        </div>

        <ul class="task-list" id="taskList" aria-label="任务列表" aria-live="polite"></ul>

        <div class="skeleton-list" id="skeleton" aria-hidden="true">
          <div class="skeleton-card">
            <span class="skeleton-check"></span>
            <div class="skeleton-body">
              <span class="skeleton-line skeleton-line--title"></span>
              <span class="skeleton-line skeleton-line--meta"></span>
            </div>
          </div>
          <div class="skeleton-card">
            <span class="skeleton-check"></span>
            <div class="skeleton-body">
              <span class="skeleton-line skeleton-line--title"></span>
              <span class="skeleton-line skeleton-line--meta"></span>
            </div>
          </div>
          <div class="skeleton-card">
            <span class="skeleton-check"></span>
            <div class="skeleton-body">
              <span class="skeleton-line skeleton-line--title"></span>
              <span class="skeleton-line skeleton-line--meta"></span>
            </div>
          </div>
          <div class="skeleton-card">
            <span class="skeleton-check"></span>
            <div class="skeleton-body">
              <span class="skeleton-line skeleton-line--title"></span>
              <span class="skeleton-line skeleton-line--meta"></span>
            </div>
          </div>
        </div>

        <div class="state-view" id="stateView" hidden></div>

        <!-- 批量选择操作条（桌面端，选中任务后出现） -->
        <div class="bulk-bar" id="bulkBar" role="toolbar" aria-label="批量操作" hidden>
          <span class="bulk-count" id="bulkCount">已选 0 项</span>
          <button class="bulk-btn bulk-btn--ghost" type="button" data-bulk="all">全选</button>
          <span class="bulk-spacer"></span>
          <button class="bulk-btn" type="button" data-bulk="done" hidden>完成</button>
          <button class="bulk-btn" type="button" data-bulk="restore" hidden>恢复</button>
          <button class="bulk-btn" type="button" data-bulk="ignore" hidden>忽略</button>
          <button class="bulk-btn" type="button" data-bulk="delete" hidden>删除</button>
          <button class="bulk-btn bulk-btn--solid" type="button" data-bulk="cancel">取消</button>
        </div>
      </main>

      <!-- 桌面端任务详情面板（窄屏隐藏，改用底部抽屉） -->
      <aside class="detail" id="detailPanel" aria-label="任务详情">
        <span class="hud hud-tl" aria-hidden="true"></span>
        <span class="hud hud-tr" aria-hidden="true"></span>
        <span class="hud hud-bl" aria-hidden="true"></span>
        <span class="hud hud-br" aria-hidden="true"></span>

        <div class="detail__head">
          <span class="dot" aria-hidden="true"></span>
          <h2>任务详情</h2>
          <span class="code" id="detailCode">TASK · 0000</span>
          <span class="state" id="detailState">只读</span>
        </div>

        <div class="detail__scroll">
          <div class="detail__content" id="detailBody"></div>
          <div class="detail__art" aria-hidden="true">
            <div class="orbit">
              <span class="orbit__dial"></span>
              <span class="orbit__ring"></span>
              <span class="orbit__ring r2"></span>
              <span class="orbit__ring r3"></span>
              <span class="orbit__sat"><i></i></span>
              <span class="orbit__sat i2"><i></i></span>
              <span class="orbit__core"></span>
            </div>
            <p>ORBIT · <span id="detailOrbitCode">0000</span></p>
          </div>
        </div>

        <div class="detail__foot" id="detailFoot"></div>
      </aside>
    </div>
  </div>

  <button class="fab" id="addBtn" type="button" aria-label="新建任务" title="新建任务">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" focusable="false">
      <path d="M12 5v14"></path>
      <path d="M5 12h14"></path>
    </svg>
  </button>

  <div class="toast-region" id="toastRegion" role="status" aria-live="polite"></div>

  <div class="sheet-overlay" id="sheetOverlay" aria-hidden="true">
    <div class="sheet-backdrop" id="sheetBackdrop"></div>

    <section class="sheet" id="detailSheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <button class="sheet-close" id="detailClose" type="button" aria-label="关闭任务详情">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M18 6 6 18"></path>
          <path d="M6 6l12 12"></path>
        </svg>
      </button>
      <div class="sheet-scroll" id="detailScroll"></div>
      <div class="sheet-footer" id="detailFooter"></div>
    </section>

    <form class="sheet sheet--form" id="newSheet" role="dialog" aria-modal="true" aria-labelledby="newSheetTitle" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <button class="sheet-close" id="newClose" type="button" aria-label="关闭新建任务">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M18 6 6 18"></path>
          <path d="M6 6l12 12"></path>
        </svg>
      </button>
      <div class="sheet-scroll">
        <h2 class="sheet-title" id="newSheetTitle">新建任务</h2>
        <p class="sheet-subtitle">手动添加一条待办，之后可以随时修改标题、截止时间和优先级。</p>

        <div class="field">
          <label for="newTitleInput">标题 <span class="required" aria-hidden="true">*</span></label>
          <input class="input" id="newTitleInput" name="title" type="text" maxlength="120" placeholder="例如：周五前提交报名表" autocomplete="off" required>
        </div>

        <div class="field">
          <label>优先级</label>
          <div class="seg" id="newPrioritySeg" role="group" aria-label="优先级">
            <button type="button" class="seg-btn" data-priority="high">高</button>
            <button type="button" class="seg-btn is-on" data-priority="normal">普通</button>
            <button type="button" class="seg-btn" data-priority="low">低</button>
          </div>
        </div>

        <div class="field">
          <label for="newDueInput">截止时间 <span class="optional">可选</span></label>
          <div class="chips" id="newDueChips">
            <button type="button" class="chip" data-due="today-18">今天 18:00</button>
            <button type="button" class="chip" data-due="tomorrow-09">明天 09:00</button>
            <button type="button" class="chip" data-due="friday-18">本周五 18:00</button>
            <button type="button" class="chip" data-due="clear">清除</button>
          </div>
          <input class="input" id="newDueInput" name="due_at" type="datetime-local">
        </div>

        <div class="field">
          <label for="newNotesInput">备注 <span class="optional">可选</span></label>
          <textarea class="input" id="newNotesInput" name="notes" rows="3" maxlength="2000" placeholder="补充说明、联系方式等"></textarea>
        </div>

        <p class="form-error" id="newError" role="alert" hidden></p>
      </div>
      <div class="sheet-footer">
        <button class="btn btn-primary btn-block" id="newSubmit" type="submit">添加任务</button>
      </div>
    </form>
  </div>

  <div class="auth-overlay" id="authOverlay" role="dialog" aria-modal="true" aria-labelledby="authTitle" aria-describedby="authDesc" hidden>
    <div class="auth-card">
      <img class="auth-logo" src="./logo.svg" alt="" width="56" height="56">
      <h2 class="auth-title" id="authTitle">输入访问令牌</h2>
      <p class="auth-desc" id="authDesc">请输入服务端配置的 <code>APP_TOKEN</code>，验证后即可查看微信待办。</p>

      <form class="auth-form" id="authForm" novalidate>
        <div class="token-field">
          <label class="sr-only" for="tokenInput">访问令牌</label>
          <input class="input" id="tokenInput" type="password" placeholder="粘贴访问令牌" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
          <button class="token-toggle" id="tokenToggle" type="button" aria-label="显示令牌">显示</button>
        </div>
        <p class="auth-error" id="authError" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" id="authSubmit" type="submit">保存并重试</button>
      </form>

      <div class="auth-status">
        <span class="sync-dot" id="authHealthDot" data-state="syncing" aria-hidden="true"></span>
        <span id="authHealthText">正在检查服务器连接…</span>
      </div>
      <p class="auth-note">令牌只保存在本机浏览器，不会发送到其他服务。地址栏中的令牌会被自动清除。</p>
    </div>
  </div>

  <script src="./app.js?v=20261028-1" defer></script>
</body>
</html>
